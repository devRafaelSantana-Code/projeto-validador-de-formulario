<!doctype html>
<html lang="pt-BR">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Validador de Formulário</title>
      <link rel="stylesheet" href="./style.css" />
   </head>
   <body>
      <div class="screen">
         <div class="leftside">
            <img src="./images/financial_data.jpg" alt="Dados Financeiros" />
         </div>
         <div class="rightside">
            <h1>Crie uma conta</h1>

            <form class="validador" action="cadastro.php" method="POST">
               <div class="form-group">
                  <label for="name">Seu nome:</label>
                  <input
                     type="text"
                     id="name"
                     name="name"
                     data-rules="required|min=2"
                  />
               </div>

               <div class="form-group">
                  <label for="email">Seu e-mail:</label>
                  <input
                     type="email"
                     id="email"
                     name="email"
                     data-rules="required|email"
                  />
               </div>

               <div class="form-group">
                  <label for="password">Sua senha:</label>
                  <input
                     type="password"
                     id="password"
                     name="password"
                     data-rules="required|min=6"
                  />
               </div>

               <button class="submit" type="submit">Cadastrar</button>
            </form>

            <div class="login">
               Já tem uma conta? <a href="#">Faça o login</a>
            </div>
         </div>
      </div>
      <script src="./script.js"></script>
   </body>
</html>
